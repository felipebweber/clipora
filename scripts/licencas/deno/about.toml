# Configuração específica para o grafo do Deno 2.7.0. Não muda a política das crates Clipora.
# OpenSSL é incluído porque a expressão resolvida de aws-lc-sys o declara como alternativa;
# cargo-about incorpora seu texto de licença no aviso gerado.
accepted = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CDLA-Permissive-2.0",
    "bzip2-1.0.6",
    "MPL-2.0",
    "OpenSSL",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
