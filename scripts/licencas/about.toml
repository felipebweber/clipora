# Configuração do cargo-about para scripts/gerar-licencas.mjs.
# Licenças aceitas para crates compiladas no executável do Clipora. Uma crate com licença fora da
# lista faz o gerador FALHAR, de propósito: a decisão de aceitar uma licença nova (sobretudo
# copyleft, como LGPL/MPL/GPL) é do usuário e deve ser registrada em docs/licencas.md.
accepted = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CDLA-Permissive-2.0",
    # bzip2-1.0.6: permissiva estilo BSD (libbz2-rs-sys, via pgp/bzip2); exige manter o aviso e
    # marcar versões alteradas. Aceita em 2026-11-05 (licencas.md §4.1).
    "bzip2-1.0.6",
    # MPL-2.0: copyleft por arquivo; obriga a oferecer o código-fonte dos arquivos MPL usados.
    "MPL-2.0",
]

# Só dependências que entram no binário final (não as de build/dev).
# O próprio Clipora (publish = false) não entra nos avisos de terceiros: sua licença é o LICENSE
# da raiz (GPL-3.0-or-later).
private = { ignore = true }
ignore-build-dependencies = true
ignore-dev-dependencies = true

# ── Exceções por crate ────────────────────────────────────────────────────────────────────────
# Nenhuma. (A exceção provisória para sequoia-openpgp/buffered-reader, LGPL-2.0-or-later, foi
# removida em 2026-11-05 após a troca pela crate `pgp` (rPGP, MIT/Apache-2.0) — licencas.md §4.1.)
# Para aceitar uma licença só para uma crate, use uma seção [nome-da-crate] com accepted = [...],
# depois de registrar a decisão do usuário em docs/licencas.md.
